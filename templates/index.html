<!DOCTYPE html>
<html lang="en" data-theme="cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhan Moodz | FreeFire Level Up Bot Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ==================== THEMES ==================== */
html[data-theme="cyan"]{
  --bg:#060913; --card:#0d1324; --card2:#121a30; --line:#1e2740;
  --accent-1:#00f2fe; --accent-2:#4facfe; --accent-3:#7f00ff;
  --accent-green:#00ff88; --accent-red:#ff3366; --accent-amber:#ffaa00;
  --text:#eef3ff; --muted:#8b9ac0;
}
html[data-theme="red"]{
  --bg:#0f0508; --card:#1a0a10; --card2:#221018; --line:#3a1a26;
  --accent-1:#ff3b5c; --accent-2:#ff6b85; --accent-3:#a80020;
  --accent-green:#ffaa00; --accent-red:#ff3366; --accent-amber:#ff8800;
  --text:#ffeef2; --muted:#b89099;
}
html[data-theme="purple"]{
  --bg:#0a0612; --card:#140a20; --card2:#1c1030; --line:#2e1c4a;
  --accent-1:#c084fc; --accent-2:#a855f7; --accent-3:#7f00ff;
  --accent-green:#00ff88; --accent-red:#ff3366; --accent-amber:#ffaa00;
  --text:#f5ecff; --muted:#a698c4;
}
html[data-theme="green"]{
  --bg:#04100a; --card:#081c12; --card2:#0c2418; --line:#1a4530;
  --accent-1:#00ff88; --accent-2:#00d4aa; --accent-3:#00a86b;
  --accent-green:#00ff88; --accent-red:#ff3366; --accent-amber:#ffaa00;
  --text:#e8fff4; --muted:#82b8a0;
}
html[data-theme="pink"]{
  --bg:#12060f; --card:#1c0a18; --card2:#281020; --line:#482038;
  --accent-1:#ff4dd2; --accent-2:#ff80dd; --accent-3:#c900a8;
  --accent-green:#00ff88; --accent-red:#ff3366; --accent-amber:#ffaa00;
  --text:#ffecf8; --muted:#c49cb8;
}
html[data-theme="orange"]{
  --bg:#120800; --card:#1c0e04; --card2:#281408; --line:#4a2410;
  --accent-1:#ff8800; --accent-2:#ffaa33; --accent-3:#ff5500;
  --accent-green:#00ff88; --accent-red:#ff3366; --accent-amber:#ffcc00;
  --text:#fff5e6; --muted:#c4a580;
}
html[data-theme="white"]{
  --bg:#0a0a0a; --card:#141414; --card2:#1c1c1c; --line:#2e2e2e;
  --accent-1:#ffffff; --accent-2:#d4d4d4; --accent-3:#8a8a8a;
  --accent-green:#e0e0e0; --accent-red:#c0c0c0; --accent-amber:#b0b0b0;
  --text:#f5f5f5; --muted:#888888;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);min-height:100vh}
body{padding:12px;font-size:14px;overflow-x:hidden;transition:background .35s,color .35s;position:relative}

/* ==================== THEME PICKER ==================== */
.theme-picker{
  position:absolute;top:14px;right:14px;z-index:500;
  display:flex;gap:6px;padding:6px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);
  transition:background .35s,border-color .35s;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.theme-picker input{display:none}
.theme-picker label{
  width:20px;height:20px;border-radius:50%;
  background:var(--c);cursor:pointer;
  border:2px solid transparent;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.theme-picker label:active{transform:scale(.9)}
.theme-picker input:checked + label{
  border-color:#fff;
  box-shadow:0 0 10px var(--c);
  transform:scale(1.1);
}

/* ==================== ICON SWITCHING ==================== */
.skull-icon{position:relative;display:flex;align-items:center;justify-content:center}
.skull-icon svg{display:none;width:100%;height:100%}
html[data-theme="cyan"]   .skull-icon .icon-cyan,
html[data-theme="red"]    .skull-icon .icon-red,
html[data-theme="purple"] .skull-icon .icon-purple,
html[data-theme="green"]  .skull-icon .icon-green,
html[data-theme="pink"]   .skull-icon .icon-pink,
html[data-theme="orange"] .skull-icon .icon-orange,
html[data-theme="white"]  .skull-icon .icon-white{display:block}

.skull-icon .fill{fill:currentColor}
.skull-icon .hole{fill:var(--card2)}
.skull-icon .bg-hole{fill:var(--bg)}
.skull-icon .line{stroke:var(--bg);fill:none;stroke-width:2.5;stroke-linecap:round}
.skull-icon .card-hole{fill:var(--card)}

/* ==================== LOADER ==================== */
.loader{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  animation:loaderOut .5s ease 2.2s forwards;
}
@keyframes loaderOut{to{opacity:0;visibility:hidden}}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.loader-logo{
  width:120px;height:120px;
  display:flex;align-items:center;justify-content:center;
  position:relative;color:var(--accent-1);
}
.loader-logo::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:3px solid var(--line);
  border-top-color:var(--accent-1);
  border-right-color:var(--accent-3);
  animation:spin 1.1s linear infinite;
}
.loader-logo::after{
  content:'';position:absolute;inset:12px;border-radius:50%;
  border:2px solid transparent;
  border-bottom-color:var(--accent-green);
  animation:spin 1.6s linear infinite reverse;
}
.loader-logo .skull-icon{width:70px;height:70px;position:relative;z-index:2}
.loader-title{
  font-size:22px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(90deg,var(--text),var(--accent-1),var(--accent-3),var(--text));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shimmer 2.4s linear infinite;
}
@keyframes shimmer{to{background-position:300% 0}}
.loader-sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:-6px}
.loader-bar{width:200px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.loader-bar span{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-1),var(--accent-green));
  animation:barFill 2s cubic-bezier(.4,0,.2,1) .15s forwards;
}
@keyframes barFill{to{width:100%}}
.loader-status{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--muted);letter-spacing:.5px;
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==================== TOAST ==================== */
.toast-wrap{
  position:fixed;top:0;left:0;right:0;z-index:10000;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px;pointer-events:none;
}
.toast{
  pointer-events:auto;
  min-width:220px;max-width:92vw;
  background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--accent-1);
  border-radius:12px;padding:12px 14px;
  color:var(--text);font-size:13px;font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:10px;
  animation:toastIn .3s ease;
}
.toast.error{border-left-color:var(--accent-red)}
.toast.success{border-left-color:var(--accent-green)}
.toast.warn{border-left-color:var(--accent-amber)}
.toast i{font-size:16px;flex:0 0 auto}
.toast.error i{color:var(--accent-red)}
.toast.success i{color:var(--accent-green)}
.toast.warn i{color:var(--accent-amber)}
.toast.info i{color:var(--accent-1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px)}}

/* ==================== LAYOUT ==================== */
.container{max-width:1100px;margin:0 auto;opacity:0;animation:fadeUp .4s ease 2.2s forwards;position:relative}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ==================== HEADER ==================== */
header{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;
  transition:background .35s,border-color .35s;position:relative;
  padding-top:52px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo-box{
  width:46px;height:46px;flex:0 0 46px;border-radius:12px;
  background:var(--card2);border:1px solid var(--accent-1);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-1);position:relative;
  box-shadow:0 0 16px -4px var(--accent-1);
  transition:box-shadow .35s,border-color .35s,background .35s;
}
.logo-box .skull-icon{width:30px;height:30px}
.brand-text h1{
  font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.2;
  background:linear-gradient(90deg,var(--text),var(--accent-1));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.brand-text h1 span{font-weight:400;font-size:12px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.brand-text p{font-size:11px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.live-tag{
  display:inline-flex;align-items:center;gap:5px;
  background:color-mix(in srgb,var(--accent-green) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--accent-green) 35%,transparent);
  color:var(--accent-green);padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;text-transform:uppercase;
}
.pulse-dot{width:6px;height:6px;background:var(--accent-green);border-radius:50%;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.header-actions{display:flex;gap:8px}
.header-actions .btn{flex:1;justify-content:center}

/* ==================== BUTTONS ==================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 14px;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  border:none;outline:none;transition:transform .15s,box-shadow .15s;
  white-space:nowrap;-webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent-2),var(--accent-1));
  color:#040914;box-shadow:0 4px 16px -4px var(--accent-1);
}
.btn-secondary{
  background:var(--card2);border:1px solid var(--line);color:var(--text);
}

/* ==================== STATS ==================== */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;align-items:center;gap:10px;min-width:0;
  transition:border-color .35s,background .35s;
}
.stat-icon{
  width:40px;height:40px;flex:0 0 40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.stat-icon.cyan{background:color-mix(in srgb,var(--accent-1) 15%,transparent);color:var(--accent-1)}
.stat-icon.green{background:color-mix(in srgb,var(--accent-green) 15%,transparent);color:var(--accent-green)}
.stat-icon.purple{background:color-mix(in srgb,var(--accent-3) 20%,transparent);color:var(--accent-1)}
.stat-icon.amber{background:color-mix(in srgb,var(--accent-amber) 15%,transparent);color:var(--accent-amber)}
.stat-content{min-width:0}
.stat-content h3{font-size:16px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-content p{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-top:2px}

/* ==================== MAIN ==================== */
.dashboard-main{display:flex;flex-direction:column;gap:12px}
.card-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;transition:background .35s,border-color .35s}
.box-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.box-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.box-title .skull-icon{width:20px;height:20px;color:var(--accent-1);flex:0 0 20px}

/* ==================== ACCOUNT CARD ==================== */
.accounts-list{display:flex;flex-direction:column;gap:10px}
.account-card{
  background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:12px;position:relative;overflow:hidden;
  transition:background .35s,border-color .35s;
}
.account-card::before{
  content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
  background:linear-gradient(180deg,var(--accent-1),var(--accent-3));border-radius:0 3px 3px 0;
}
.acc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.acc-profile{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.acc-avatar{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  background:var(--card);border:1px solid var(--accent-1);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-1);font-size:15px;
}
.acc-info{min-width:0;flex:1}
.acc-info h4{
  font-size:13px;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  overflow:hidden;text-overflow:ellipsis;
}
.region-badge{
  background:color-mix(in srgb,var(--accent-3) 20%,transparent);
  border:1px solid color-mix(in srgb,var(--accent-3) 40%,transparent);
  color:var(--accent-1);padding:1px 6px;border-radius:5px;
  font-size:9px;font-weight:800;letter-spacing:.5px;
}
.acc-info span{
  display:block;font-size:10.5px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.acc-status{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;padding:4px 8px;
  border-radius:14px;text-transform:uppercase;letter-spacing:.3px;
  white-space:nowrap;flex:0 0 auto;
}
.status-online{
  background:color-mix(in srgb,var(--accent-green) 12%,transparent);
  color:var(--accent-green);
  border:1px solid color-mix(in srgb,var(--accent-green) 32%,transparent);
}
.status-match{
  background:color-mix(in srgb,var(--accent-1) 14%,transparent);
  color:var(--accent-1);
  border:1px solid color-mix(in srgb,var(--accent-1) 45%,transparent);
}
.status-match .pulse-dot{background:var(--accent-1)}

.exp-box{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
  background:var(--bg);border:1px solid var(--line);
  padding:8px 10px;border-radius:10px;margin-bottom:10px;
}
.exp-item{min-width:0}
.exp-label{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px;display:block}
.exp-val{
  font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;
  color:var(--text);display:block;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.exp-gained{color:var(--accent-green)!important}
.gained-badge{
  background:color-mix(in srgb,var(--accent-green) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--accent-green) 32%,transparent);
  padding:2px 7px;border-radius:5px;font-size:11px;font-weight:800;
}

.level-progress{margin-bottom:10px}
.level-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px}
.progress-bar-bg{height:5px;background:var(--line);border-radius:6px;overflow:hidden}
.progress-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--accent-1),var(--accent-green));
  border-radius:6px;transition:width .4s;
}

.acc-actions{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-top:8px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;flex-wrap:wrap;
}
.action-btns{display:flex;gap:6px}
.icon-btn{
  background:var(--card);border:1px solid var(--line);
  color:var(--muted);width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;transition:background .15s,color .15s,border-color .15s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:hover{color:var(--accent-1);border-color:var(--accent-1)}
.icon-btn.danger:hover{color:var(--accent-red);border-color:var(--accent-red)}

/* ==================== LOGS ==================== */
.terminal{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.terminal-bar{display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--card2);border-bottom:1px solid var(--line)}
.terminal-bar .dot{width:8px;height:8px;border-radius:50%}
.terminal-bar .dot.red{background:#ff5f57}
.terminal-bar .dot.amber{background:#febc2e}
.terminal-bar .dot.green{background:#28c840}
.terminal-title{margin-left:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.log-stream{
  min-height:280px;max-height:420px;overflow-y:auto;
  padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;
  display:flex;flex-direction:column;gap:6px;
}
.log-stream::-webkit-scrollbar{width:5px}
.log-stream::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.log-item{line-height:1.45;word-break:break-word}
.log-time{color:var(--muted);margin-right:6px;opacity:.7}
.log-info{color:var(--accent-1)}
.log-success{color:var(--accent-green)}
.log-warning{color:var(--accent-amber)}
.log-error{color:var(--accent-red)}

/* ==================== MODAL ==================== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(3,6,15,.9);
  display:none;align-items:center;justify-content:center;
  padding:16px;z-index:200;
}
.modal-overlay.active{display:flex}
.modal-card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;padding:20px;max-height:90vh;overflow-y:auto;
  transition:background .35s,border-color .35s;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.modal-header h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--text)}
.modal-header .skull-icon{width:20px;height:20px;color:var(--accent-1);flex:0 0 20px}
.form-group{margin-bottom:12px}
.form-group label{
  display:block;font-size:11px;font-weight:700;color:var(--muted);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;
}
.form-input{
  width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;
  outline:none;font-family:'JetBrains Mono',monospace;
  transition:border-color .15s,box-shadow .15s;
}
.form-input:focus{border-color:var(--accent-1);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-1) 18%,transparent)}
.form-input::placeholder{color:var(--muted);opacity:.7}
textarea.form-input{resize:vertical;min-height:70px;line-height:1.4}

/* ==================== TYPE SWITCH (ganti <select>) ==================== */
.type-switch{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:4px;
}
.type-switch input{display:none}
.type-switch label{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 8px;border-radius:7px;
  font-size:12px;font-weight:700;
  color:var(--muted);cursor:pointer;
  text-transform:none;letter-spacing:0;margin:0;
  transition:background .2s,color .2s,box-shadow .2s;
  white-space:nowrap;overflow:hidden;
}
.type-switch label i{font-size:13px}
.type-switch label:active{transform:scale(.97)}
.type-switch input:checked + label{
  background:linear-gradient(135deg,var(--accent-2),var(--accent-1));
  color:#040914;
  box-shadow:0 2px 10px -2px var(--accent-1);
}

/* ==================== EMPTY ==================== */
.empty-state{text-align:center;padding:30px 16px;color:var(--muted);font-size:13px}
.empty-state .skull-icon{width:60px;height:60px;margin:0 auto 10px;color:var(--accent-1);opacity:.55}

/* ==================== RESPONSIVE ==================== */
@media (min-width:700px){
  body{padding:20px}
  .theme-picker{top:24px;right:24px}

      <button class="icon-btn" onclick="closeAddModal()" type="button"><i class="fa-solid fa-xmark"></i></button>

<!-- ============================================================
     TOAST + THEME + TYPE SWITCH SYNC (di luar script utama)
     ============================================================ -->
<script>
(function(){
  // ===== TOAST =====
  function getWrap(){
    var w = document.querySelector('.toast-wrap');
    if(!w){
      w = document.createElement('div');
      w.className = 'toast-wrap';
      document.body.appendChild(w);
    }
    return w;
  }
  function detectType(msg){
    var m = String(msg).toLowerCase();
    if(/error|fail|gagal|salah|invalid|tidak bisa|tidak ditemukan/.test(m)) return 'error';
    if(/please|enter|required|masukkan|wajib|kosong|must/.test(m)) return 'warn';
    if(/success|berhasil|sukses|saved|ditambah|ok\b/.test(m)) return 'success';
    return 'info';
  }
  function showToast(msg, type){
    if(msg === undefined || msg === null) return;
    if(!type) type = detectType(msg);
    var iconMap = {
      error:'fa-circle-exclamation',
      warn:'fa-triangle-exclamation',
      success:'fa-circle-check',
      info:'fa-circle-info'
    };
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<i class="fa-solid ' + iconMap[type] + '"></i><span></span>';
    el.querySelector('span').textContent = String(msg);
    getWrap().appendChild(el);
    setTimeout(function(){
      el.style.animation = 'toastOut .3s ease forwards';
      setTimeout(function(){ el.remove(); }, 320);
    }, 3200);
  }
  try { window.alert = function(msg){ showToast(msg); }; } catch(e){}
  window.showToast = showToast;

  // ===== THEME SWITCHER =====
  var radios = document.querySelectorAll('input[name="theme"]');
  function applyTheme(val){
    document.documentElement.setAttribute('data-theme', val);
    try { localStorage.setItem('dhanmoodz_theme', val); } catch(e){}
  }
  var saved = null;
  try { saved = localStorage.getItem('dhanmoodz_theme'); } catch(e){}
  if(saved){
    var found = false;
    radios.forEach(function(r){ if(r.value === saved){ r.checked = true; found = true; } });
    if(found) applyTheme(saved);
  }
  radios.forEach(function(r){
    r.addEventListener('change', function(){
      if(this.checked) applyTheme(this.value);
    });
  });

  // ===== TYPE SWITCH SYNC =====
  // Menyalin nilai radio → hidden input #acc-type
  // lalu panggil toggleFormType() agar field guest/token muncul/sembunyi
  document.querySelectorAll('input[name="acc-type-radio"]').forEach(function(r){
    r.addEventListener('change', function(){
      if(this.checked){
        var hidden = document.getElementById('acc-type');
        if(hidden) hidden.value = this.value;
        if(typeof toggleFormType === 'function') toggleFormType();
      }
    });
  });
})();
</script>

<!-- ============================================================
     SCRIPT UTAMA — 100% TIDAK DIUBAH
     ============================================================ -->
<script>
    let startTime = Date.now();

    function openAddModal() {
        document.getElementById('add-modal').classList.add('active');
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('active');
    }

    function toggleFormType() {
        const type = document.getElementById('acc-type').value;
        document.getElementById('guest-fields').style.display = type === 'guest' ? 'block' : 'none';
        document.getElementById('token-fields').style.display = type === 'token' ? 'block' : 'none';
    }

    async function submitAddAccount(e) {
        e.preventDefault();
        const type = document.getElementById('acc-type').value;
        let payload = {};
        if (type === 'guest') {
            const uid = document.getElementById('acc-uid').value.trim();
            const password = document.getElementById('acc-password').value.trim();
            if (!uid || !password) return alert('Please enter both UID and Password');
            payload = { uid, password };
        } else {
            const token = document.getElementById('acc-token').value.trim();
            if (!token) return alert('Please enter token');
            payload = { token };
        }

        try {
            const res = await fetch('/api/account/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === 'ok') {
                closeAddModal();
                document.getElementById('add-acc-form').reset();
                fetchStats();
            } else {
                alert('Error adding account: ' + (data.error || 'Unknown'));
            }
        } catch (err) {
            alert('Request failed: ' + err);
        }
    }

    async function deleteAccount(uid) {
        if (!confirm('Are you sure you want to remove account ' + uid + '?')) return;
        try {
            const res = await fetch('/api/account/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid })
            });
            fetchStats();
        } catch (err) {
            console.error(err);
        }
    }

    async function refreshAccountInfo(uid) {
        try {
            await fetch('/api/account/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid })
            });
            fetchStats();
        } catch (err) {
            console.error(err);
        }
    }

    async function fetchStats() {
        try {
            const res = await fetch('/api/stats');
            const data = await res.json();

            document.getElementById('stat-total-accounts').innerText = data.total_accounts;
            document.getElementById('stat-total-exp').innerText = '+' + data.total_gained_exp.toLocaleString() + ' EXP';
            document.getElementById('stat-total-matches').innerText = data.total_matches;

            const container = document.getElementById('accounts-container');
            if (data.accounts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="skull-icon" style="width:60px;height:60px;margin:0 auto 10px;color:var(--accent-1);opacity:.55">
                            <svg class="icon-cyan" viewBox="0 0 100 100"><path class="fill" d="M50 8 C28 8 12 24 12 44 C12 56 18 66 26 72 L26 86 C26 89 28 92 32 92 L68 92 C72 92 74 89 74 86 L74 72 C82 66 88 56 88 44 C88 24 72 8 50 8 Z"/><ellipse class="card-hole" cx="34" cy="42" rx="10" ry="12"/><ellipse class="card-hole" cx="66" cy="42" rx="10" ry="12"/><path class="card-hole" d="M50 58 L46 70 L54 70 Z"/></svg>
                            <svg class="icon-red" viewBox="0 0 100 100"><path class="fill" d="M28 24 L12 6 L24 32 Z"/><path class="fill" d="M72 24 L88 6 L76 32 Z"/><path class="fill" d="M50 22 C30 22 18 36 18 54 C18 64 24 72 30 76 L30 88 C30 90 32 92 34 92 L66 92 C68 92 70 90 70 88 L70 76 C76 72 82 64 82 54 C82 36 70 22 50 22 Z"/><circle class="card-hole" cx="36" cy="52" r="8"/><circle class="card-hole" cx="64" cy="52" r="8"/><path class="card-hole" d="M50 66 L46 76 L54 76 Z"/></svg>
                            <svg class="icon-purple" viewBox="0 0 100 100"><path class="fill" d="M50 10 C26 10 15 32 15 55 L15 88 C15 90 17 91 19 90 L25 86 C27 85 29 86 31 88 L36 93 C38 95 42 95 44 93 L50 88 C52 86 54 86 56 88 L62 93 C64 95 68 95 70 93 L75 88 C77 86 79 85 81 86 L85 90 C87 91 89 90 89 88 L89 55 C89 32 75 10 50 10 Z"/><ellipse class="card-hole" cx="35" cy="48" rx="6" ry="8"/><ellipse class="card-hole" cx="65" cy="48" rx="6" ry="8"/><ellipse class="card-hole" cx="50" cy="66" rx="4" ry="5"/></svg>
                            <svg class="icon-green" viewBox="0 0 100 100"><ellipse class="fill" cx="50" cy="50" rx="36" ry="42"/><ellipse class="card-hole" cx="33" cy="44" rx="13" ry="17"/><ellipse class="card-hole" cx="67" cy="44" rx="13" ry="17"/></svg>
                            <svg class="icon-pink" viewBox="0 0 100 100"><path class="fill" d="M50 22 C30 22 20 36 20 54 C20 62 24 68 28 72 L28 86 C28 89 30 91 33 91 L67 91 C70 91 72 89 72 86 L72 72 C76 68 80 62 80 54 C80 36 70 22 50 22 Z"/><ellipse class="card-hole" cx="38" cy="48" rx="6" ry="8"/><ellipse class="card-hole" cx="62" cy="48" rx="6" ry="8"/><path class="card-hole" d="M50 62 L47 70 L53 70 Z"/><path class="fill" d="M22 12 L12 6 L14 18 Z M22 12 L32 6 L30 18 Z"/><circle class="fill" cx="22" cy="12" r="3"/></svg>
                            <svg class="icon-orange" viewBox="0 0 100 100"><path class="fill" d="M25 32 Q18 20 30 12 Q27 24 36 20 Q33 8 45 4 Q43 18 54 12 Q54 2 60 12 Q68 8 66 20 Q76 16 78 30 Q72 24 66 32 L60 30 Q58 22 50 24 Q42 22 40 30 Z"/><path class="fill" d="M50 30 C30 30 20 44 20 58 C20 70 28 78 35 80 L35 88 C35 91 38 93 42 93 L58 93 C62 93 65 91 65 88 L65 80 C72 78 80 70 80 58 C80 44 70 30 50 30 Z"/><circle class="card-hole" cx="38" cy="56" r="6"/><circle class="card-hole" cx="62" cy="56" r="6"/><path class="card-hole" d="M50 68 L47 76 L53 76 Z"/></svg>
                            <svg class="icon-white" viewBox="0 0 100 100"><g transform="rotate(35 50 50)"><rect class="fill" x="10" y="46" width="80" height="8" rx="4"/></g><g transform="rotate(-35 50 50)"><rect class="fill" x="10" y="46" width="80" height="8" rx="4"/></g><path class="fill" d="M50 22 C34 22 24 34 24 48 C24 58 30 66 36 68 L36 82 C36 85 38 87 41 87 L59 87 C62 87 64 85 64 82 L64 68 C70 66 76 58 76 48 C76 34 66 22 50 22 Z"/><ellipse class="card-hole" cx="40" cy="46" rx="5" ry="7"/><ellipse class="card-hole" cx="60" cy="46" rx="5" ry="7"/></svg>
                        </div>
                        <p>No active accounts running. Click "+ Add Account" to start!</p>
                    </div>
                `;
            } else {
                container.innerHTML = data.accounts.map(acc => {
                    const gainedExp = acc.gained_exp || 0;
                    const statusClass = acc.status === 'IN_MATCH' ? 'status-match' : 'status-online';
                    const statusText = acc.status === 'IN_MATCH' ? `In Match (${acc.active_matches} active)` : acc.status;
                    
                    return `
                        <div class="account-card">
                            <div class="acc-top">
                                <div class="acc-profile">
                                    <div class="acc-avatar"><i class="fa-solid fa-skull"></i></div>
                                    <div class="acc-info">
                                        <h4>${escapeHtml(acc.nickname)} <span class="region-badge">${acc.region || 'BD'}</span></h4>
                                        <span>UID: ${acc.uid}</span>
                                    </div>
                                </div>
                                <div class="acc-status ${statusClass}">
                                    <span class="pulse-dot"></span>
                                    <span>${statusText}</span>
                                </div>
                            </div>

                            <div class="exp-box">
                                <div class="exp-item">
                                    <span class="exp-label">Initial EXP</span>
                                    <span class="exp-val">${acc.initial_exp.toLocaleString()}</span>
                                </div>
                                <div class="exp-item">
                                    <span class="exp-label">Current EXP</span>
                                    <span class="exp-val">${acc.current_exp.toLocaleString()}</span>
                                </div>
                                <div class="exp-item">
                                    <span class="exp-label">EXP Gained</span>
                                    <span class="exp-val exp-gained">
                                        <span class="gained-badge">+${gainedExp.toLocaleString()}</span>
                                    </span>
                                </div>
                            </div>

                            <div class="level-progress">
                                <div class="level-labels">
                                    <span style="color:var(--accent-1)">Level ${acc.level}</span>
                                    <span style="color:var(--muted)">Matches: ${acc.matches_played}</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${Math.min(100, Math.max(15, (acc.current_exp % 1000) / 10))}%"></div>
                                </div>
                            </div>

                            <div class="acc-actions">
                                <span>Last: ${acc.last_match_time || 'Running...'}</span>
                                <div class="action-btns">
                                    <button class="icon-btn" title="Refresh" onclick="refreshAccountInfo('${acc.uid}')"><i class="fa-solid fa-rotate"></i></button>
                                    <button class="icon-btn danger" title="Delete" onclick="deleteAccount('${acc.uid}')"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const logContainer = document.getElementById('log-stream');
            logContainer.innerHTML = data.logs.map(log => {
                return `<div class="log-item"><span class="log-time">[${log.time}]</span><span class="log-${log.level}">${escapeHtml(log.message)}</span></div>`;
            }).join('');
            logContainer.scrollTop = logContainer.scrollHeight;

        } catch (err) {
            console.error("Failed to fetch stats:", err);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById('stat-uptime').innerText = `${h}:${m}:${s}`;
    }, 1000);

    fetchStats();
    setInterval(fetchStats, 2500);
</script>
